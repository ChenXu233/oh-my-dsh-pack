# CNB 流水线
#
# 触发策略(重要):
#   - 推分支(main)  : 只做构建验证。不推镜像、不部署、不读取任何密钥。
#   - 打 tag(v* 等) : 构建 + 推镜像(:latest 与 :<tag>) + SSH 部署到服务器。
#
# 也就是说: 日常 push 不会动生产环境, 只有打 tag 才会部署。
# 权威源是 CNB; GitHub 不参与(不镜像、不部署), 避免两边竞争推送。
# 密钥: CNB 没有 GitLab 的 from_secret, 敏感值放密钥仓库, 用 imports 注入。
#       密钥仓库: https://cnb.cool/ChenXu233/secrets , 文件 dsh-deploy.yml
#
# 若希望 push 完全不触发任何流水线, 删掉下面 main.push 这一段即可。

main:
  push:
    - services:
        - docker
      stages:
        - name: build image (verify only, not released)
          script: docker build -t oh-my-dsh-pack:verify --build-arg DSH_VERSION=next .

"v*":
  tag_push:
    - services:
        - docker
      imports:
        - https://cnb.cool/ChenXu233/secrets/-/blob/main/dsh-deploy.yml
      stages:
        - name: build image
          script: docker build -t docker.cnb.cool/chenxu233/oh-my-dsh-pack:latest --build-arg DSH_VERSION=next .

        - name: push image
          script: |
            docker login docker.cnb.cool -u cnb -p "$CNB_TOKEN"
            docker push docker.cnb.cool/chenxu233/oh-my-dsh-pack:latest
            # tag 名同时作为一个镜像 tag, 方便回滚到指定版本
            TAG="${CNB_BRANCH:-unknown}"
            docker tag docker.cnb.cool/chenxu233/oh-my-dsh-pack:latest docker.cnb.cool/chenxu233/oh-my-dsh-pack:$TAG
            docker push docker.cnb.cool/chenxu233/oh-my-dsh-pack:$TAG
            echo "pushed: latest, $TAG"

        - name: deploy to tencent cloud
          image: alpine
          script:
            - apk add openssh-client > /dev/null 2>&1
            - |
              # 缺变量 = 配置坏了, 直接失败。绝不 exit 0 假装成功。
              missing=""
              [ -z "${DEPLOY_SSH_KEY:-}" ] && missing="$missing DEPLOY_SSH_KEY"
              [ -z "${DEPLOY_HOST:-}" ]    && missing="$missing DEPLOY_HOST"
              if [ -n "$missing" ]; then
                echo "ERROR 缺少变量:$missing"
                echo "检查密钥仓库 dsh-deploy.yml 是否含这两项, 以及 imports URL 是否正确"
                exit 1
              fi

              printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/k && chmod 600 /tmp/k
              # 服务器上的 key 带 command= 强制项, 只能执行 ~/bin/dsh-deploy.sh
              # (同 repo 的 deploy/dsh-deploy.sh); 这里不发远程命令, 发了也会被忽略。
              ssh -i /tmp/k -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "ubuntu@$DEPLOY_HOST"
