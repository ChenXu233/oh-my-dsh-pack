# CNB 流水线
#
# 触发策略(重要):
#   - 推分支(main)  : 构建验证 + 同步镜像到 GitHub。不推镜像、不部署。
#   - 打 tag(v* 等) : 构建 + 推镜像(:latest/:slim/:ci 与 :<tag> 系列) + 同步 tag + SSH 部署。
#   - web_trigger_ci_image : 手动只构建+推 :ci 制品包，不部署（main 分支详情页按钮）。
#
# 镜像分两档环境(见 Dockerfile / docs/PLANS.md):
#   :latest  = capable  full / harness         (带 Python + LibreOffice + 中文字体)
#   dev 方向默认走 base → :slim; 插件真需要系统依赖时才改成 capable
#   :slim    = slim     chat                  (只有 node + dsh + pnpm + git)
# 三档用同一个 Dockerfile, 只是 --target 不同; 方向(plans/)挂载, 不进镜像。
#   :ci      = base + 预置 headless profile (agent-teams)，一次性任务零冷装。
#
# GitHub 镜像: 用官方插件 tencentcom/git-sync 推送。
#   旧版用 GitLab 的 from_secret 拿 token, CNB 不认, 变量恒为空,
#   脚本每次都在 "未配置, 跳过" 处 exit 0 —— 镜像因此一直停在第一个提交。
#   现在密钥放密钥仓库的 github-sync.yml: GITHUB_USERNAME / GITHUB_TOKEN。
#   注意文件必须是 YAML (`GITHUB_USERNAME: "x"`); dotenv 的 KEY=VALUE 会被判成非法 YAML,
#   报错是 "Failed to parse file ... Invalid YAML content", 而且发生在插件启动之前。
#
# 密钥: CNB 没有 from_secret, 敏感值放密钥仓库用 imports 注入。
#       密钥仓库: https://cnb.cool/ChenXu233/secrets

main:
  # 自动 Tag 规则：默认 feat 会升 minor；本仓库把 feat 也定为 patch。
  # 原因是任意 v* tag 都会触发部署，日常改动不想抬次版本号；
  # 需要发 minor/major 时手工打 tag。
  auto_tag:
    - stages:
        - name: release rules
          script: |
            cat > release-rules.json <<'EOF'
            [
              { "type": "feat", "release": "patch" },
              { "type": "fix", "release": "patch" },
              { "type": "perf", "release": "patch" },
              { "type": "docs", "release": "patch" },
              { "type": "refactor", "release": "patch" },
              { "type": "chore", "release": "patch" },
              { "type": "style", "release": "patch" },
              { "type": "test", "release": "patch" },
              { "type": "build", "release": "patch" },
              { "type": "ci", "release": "patch" },
              { "type": "revert", "release": "patch" }
            ]
            EOF
            echo "RELEASE_RULES=$PWD/release-rules.json" >> $CNB_ENV_FILE
        - name: auto tag
          image: cnbcool/git-auto-tag:latest
          settings:
            tagFormat: 'v${version}'
            branch: $CNB_BRANCH
            repoUrlHttps: $CNB_REPO_URL_HTTPS
            releaseRules: $RELEASE_RULES
          exports:
            tag: NEW_TAG

  push:
    - services:
        - docker
      stages:
        # 只引用这个文件: 里面只有同步用的 GITHUB_USERNAME / GITHUB_TOKEN,
        # 不含部署凭据。push 阶段仍然拿不到 SSH 密钥。
        - name: sync to github (mirror)
          imports: https://cnb.cool/ChenXu233/secrets/-/blob/main/github-sync.yml
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/ChenXu233/oh-my-dsh-pack.git
            auth_type: https
            username: "${GITHUB_USERNAME}"
            password: "${GITHUB_TOKEN}"
            branch: main
            push_tags: true

        # slim 就是 base 加空行; capable 能过, slim 必过, 所以 push 只验 capable
        - name: build image (verify only, not released)
          script: |
            docker build --target capable \
              -t oh-my-dsh-pack:verify-capable --build-arg DSH_VERSION=0.2.3-alpha.3 .

        # ci 档也要验: Dockerfile 里多一段预装 profile, 挂了就早发现
        - name: build ci image (verify only)
          script: |
            docker build --target ci \
              -t oh-my-dsh-pack:verify-ci --build-arg DSH_VERSION=0.2.3-alpha.3 .

"v*":
  tag_push:
    - services:
        - docker
      imports:
        - https://cnb.cool/ChenXu233/secrets/-/blob/main/dsh-deploy.yml
      stages:
        - name: build image
          script: |
            docker build --target capable -t docker.cnb.cool/chenxu233/oh-my-dsh-pack:latest --build-arg DSH_VERSION=0.2.3-alpha.3 .
            docker build --target slim -t docker.cnb.cool/chenxu233/oh-my-dsh-pack:slim --build-arg DSH_VERSION=0.2.3-alpha.3 .
            docker build --target ci -t docker.cnb.cool/chenxu233/oh-my-dsh-pack:ci --build-arg DSH_VERSION=0.2.3-alpha.3 .

        - name: push image
          script: |
            docker login docker.cnb.cool -u cnb -p "$CNB_TOKEN"
            docker push docker.cnb.cool/chenxu233/oh-my-dsh-pack:latest
            docker push docker.cnb.cool/chenxu233/oh-my-dsh-pack:slim
            docker push docker.cnb.cool/chenxu233/oh-my-dsh-pack:ci
            # tag 名同时作为镜像 tag, 方便回滚到指定版本
            TAG="${CNB_BRANCH:-unknown}"
            docker tag docker.cnb.cool/chenxu233/oh-my-dsh-pack:latest docker.cnb.cool/chenxu233/oh-my-dsh-pack:$TAG
            docker tag docker.cnb.cool/chenxu233/oh-my-dsh-pack:slim   docker.cnb.cool/chenxu233/oh-my-dsh-pack:$TAG-slim
            docker tag docker.cnb.cool/chenxu233/oh-my-dsh-pack:ci     docker.cnb.cool/chenxu233/oh-my-dsh-pack:$TAG-ci
            docker push docker.cnb.cool/chenxu233/oh-my-dsh-pack:$TAG
            docker push docker.cnb.cool/chenxu233/oh-my-dsh-pack:$TAG-slim
            docker push docker.cnb.cool/chenxu233/oh-my-dsh-pack:$TAG-ci
            echo "pushed: latest, slim, ci, $TAG, $TAG-slim, $TAG-ci"

        # 按发布时间保留最近三个月版本 tag; 滚动 tag 不动。
        # 删除 tag 后未引用 blob 由制品库 GC 回收; Git tag 仍可追溯并按需重建任意版本。
        - name: prune artifact tags older than 3 months
          image: node:22-alpine
          imports: https://cnb.cool/ChenXu233/secrets/-/blob/main/ohmydsh-registry.yml
          script: |
            set -eu
            : "${CNB_TOKEN:?缺少 CNB_TOKEN}"
            export API="https://api.cnb.cool"
            export SLUG="ChenXu233/oh-my-dsh-pack"
            export PKG="oh-my-dsh-pack"
            d=$(date -u +%Y-%m-%d) && y=$(date -u -d "$d - 3 months" +%Y) && m=$(date -u -d "$d - 3 months" +%-m)
            export CUTOFF="$(date -u -d "${y}-${m}-01" +%Y-%m-%dT%H:%M:%SZ)"
            node <<'NODE'
            const cutoff = new Date(process.env.CUTOFF);
            const api = process.env.API;
            const slug = process.env.SLUG;
            const pkg = process.env.PKG;
            const token = process.env.CNB_TOKEN;
            const headers = { Accept: 'application/json', Authorization: `Bearer ${token}` };
            const rolling = new Set(['latest', 'slim', 'ci']);

            async function request(path, init) {
              const res = await fetch(`${api}${path}`, init);
              if (!res.ok) throw new Error(`HTTP ${res.status} ${path}: ${await res.text()}`);
              return res.status === 204 ? null : res.json();
            }

            async function main() {
              let page = 1;
              let deleted = 0;
              while (true) {
                const data = await request(
                  `/${slug}/-/packages/docker/${pkg}/-/tags?ordering=last_push_at&page=${page}&page_size=100`,
                  { headers },
                );
                const tags = data?.docker || data?.tags || [];
                if (!tags.length) break;
                for (const tag of tags) {
                  const name = tag.name;
                  if (!name || rolling.has(name) || !/^v\d/.test(name)) continue;
                  const pushedAt = tag.last_pusher?.push_at;
                  if (!pushedAt || new Date(pushedAt) >= cutoff) continue;
                  await request(
                    `/${slug}/-/packages/docker/${pkg}/-/tag/${encodeURIComponent(name)}`,
                    { method: 'DELETE', headers },
                  );
                  console.log(`deleted stale artifact tag: ${name} (${pushedAt})`);
                  deleted++;
                }
                page++;
              }
              console.log(`artifact tag prune done: deleted ${deleted}, cutoff ${cutoff.toISOString()}`);
            }

            main().catch((error) => {
              console.error(error.message);
              process.exit(1);
            });
            NODE

        # tag 也要同步, 否则 GitHub 上没有可回滚的版本点
        - name: sync tag to github
          imports: https://cnb.cool/ChenXu233/secrets/-/blob/main/github-sync.yml
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/ChenXu233/oh-my-dsh-pack.git
            auth_type: https
            username: "${GITHUB_USERNAME}"
            password: "${GITHUB_TOKEN}"
            branch: main
            push_tags: true

        - name: deploy to tencent cloud
          image: alpine
          script:
            - apk add openssh-client > /dev/null 2>&1
            - |
              # 缺变量 = 配置坏了, 直接失败。绝不 exit 0 假装成功。
              missing=""
              [ -z "${DEPLOY_SSH_KEY:-}" ] && missing="$missing DEPLOY_SSH_KEY"
              [ -z "${DEPLOY_HOST:-}" ]    && missing="$missing DEPLOY_HOST"
              if [ -n "$missing" ]; then
                echo "ERROR 缺少变量:$missing"
                echo "检查密钥仓库 dsh-deploy.yml 是否含这两项, 以及 imports URL 是否正确"
                exit 1
              fi

              printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/k && chmod 600 /tmp/k
              # 服务器上的 key 带 command= 强制项, 只能执行 ~/bin/dsh-deploy.sh
              # (同 repo 的 deploy/dsh-deploy.sh); 这里不发远程命令, 发了也会被忽略。
              ssh -i /tmp/k -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "ubuntu@$DEPLOY_HOST"

# 手动构建 CI 制品包：只推 :ci 镜像，不碰 :latest/:slim，也不触发部署。
# 用法：在 main 分支详情页点 "构建 CI 制品包" 按钮。
$:
  web_trigger_ci_image:
    - services:
        - docker
      stages:
        - name: build ci cache
          type: docker:cache
          options:
            dockerfile: Dockerfile.cache
            by: Dockerfile.cache
            buildArgs:
              DSH_VERSION: 0.2.3-alpha.3
            sync: true
          exports:
            name: CI_CACHE_IMAGE
        - name: build and push :ci
          script: |
            echo "cache image: ${CI_CACHE_IMAGE:-<none>}"
            CACHE_FROM=""
            [ -n "${CI_CACHE_IMAGE:-}" ] && CACHE_FROM="--cache-from $CI_CACHE_IMAGE"
            docker build --target ci \
              ${CACHE_FROM} \
              -t docker.cnb.cool/chenxu233/oh-my-dsh-pack:ci \
              --build-arg DSH_VERSION=0.2.3-alpha.3 \
              .
            docker login docker.cnb.cool -u cnb -p "$CNB_TOKEN"
            docker push docker.cnb.cool/chenxu233/oh-my-dsh-pack:ci
            echo "pushed: docker.cnb.cool/chenxu233/oh-my-dsh-pack:ci"
