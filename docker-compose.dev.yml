# ============================================================================
# 开发实例（独立栈，和 docker-compose.yml 的生产栈互不干扰）
# ----------------------------------------------------------------------------
# 用途: 起一个空白 dsh（plans/dev: 不预装插件），把插件源码挂进容器，
#       由 bootstrap-dev/20-link-plugins.sh 用 link: 装进 web profile。
#
# 与生产栈的隔离:
#   项目名 harness-dev、容器 harness-dsh-dev、卷 dsh-dev-*、端口 3211。
#   生产栈的卷 / 容器 / 端口完全不受影响。
#
# 目录约定: 一个插件一个子目录
#   ${DSH_DEV_PLUGINS:-/srv/dev-plugins}/<插件>/
#     ├── package.json
#     └── 入口文件        （package.json 的 exports["."] / main 指向的那个，先构建）
#   注意: link: 不会给被链接目录装依赖 —— 有 dependencies 的包请用 pnpm pack + tgz 安装。
#
# 用法:
#   ./scripts/up.sh dev
#   docker compose -f docker-compose.dev.yml logs -f dsh
#   docker compose -f docker-compose.dev.yml down -v   # 连卷清掉, 回到空白
# ============================================================================
name: harness-dev

services:
  dsh:
    # 默认 base 档（:slim）: 开发迭代要快。插件真要系统依赖时改 PLAN_ENV=capable
    image: ${DSH_DEV_IMAGE:-docker.cnb.cool/chenxu233/oh-my-dsh-pack:latest}
    build:
      context: .
      target: ${DSH_DEV_TARGET:-slim}
      args:
        DSH_VERSION: ${DSH_VERSION:-next}
        INSTALL_FFMPEG: ${INSTALL_FFMPEG:-0}
        INSTALL_CHROMIUM: ${INSTALL_CHROMIUM:-0}
    container_name: harness-dsh-dev
    environment:
      DSH_PLAN: dev
      # 远程访问开发实例时再填; 留空就用 localhost:3211
      DSH_PUBLIC_URL: ${DSH_DEV_PUBLIC_URL:-}
      DSH_TRUSTED_HOST: ${DSH_DEV_TRUSTED_HOST:-}
    # 开发实例失败要看得见, 不自动拉起
    restart: "no"
    ports:
      - "127.0.0.1:3211:3080"
    volumes:
      - dsh-dev-home:/data/dsh-home
      - dsh-dev-workspace:/data/workspace
      - ./plans:/opt/plans:ro
      - ${DSH_DEV_PLUGINS:-/srv/dev-plugins}:/opt/dev-plugins:ro
      - ./bootstrap-dev:/opt/dev:ro
    working_dir: /data/workspace
    mem_limit: ${DSH_DEV_MEM_LIMIT:-2g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dsh-dev-home:
  dsh-dev-workspace:
