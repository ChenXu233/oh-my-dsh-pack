name: harness

services:
  dsh:
    # 镜像由 CNB 流水线构建并推送到 CNB 制品库
    #   :latest = capable (full / harness)   :slim = 只有 dsh 本体 (mini / chat / coder)
    # 用 ./scripts/up.sh <方案> 启动时会自动选对 tag
    image: ${DSH_IMAGE:-docker.cnb.cool/chenxu233/oh-my-dsh-pack:latest}
    # 本地构建入口: ./scripts/up.sh --build <方案> (CI 仍用 docker build --target, 因为两档要各自打 tag)
    build:
      context: .
      target: ${DSH_TARGET:-capable}
      args:
        DSH_VERSION: ${DSH_VERSION:-next}
        INSTALL_FFMPEG: ${INSTALL_FFMPEG:-0}
        INSTALL_CHROMIUM: ${INSTALL_CHROMIUM:-0}
    container_name: harness-dsh

    # 启动逻辑只在镜像里一份: /opt/entrypoint.sh -> /opt/scripts/plan-boot.sh
    # compose 只负责把"选哪个方案"和"对外地址"传进去, 不再复制一遍启动脚本
    environment:
      DSH_PLAN: ${DSH_PLAN:-full}
      DSH_PUBLIC_URL: ${DSH_PUBLIC_URL:-https://harness.chenxu233.cn}
      DSH_TRUSTED_HOST: ${DSH_TRUSTED_HOST:-harness.chenxu233.cn}

    restart: unless-stopped
    ports:
      - "127.0.0.1:3210:3080"   # 只绑宿主回环, 公网入口是 Caddy
    volumes:
      - dsh-home:/data/dsh-home
      - dsh-workspace:/data/workspace
    working_dir: /data/workspace
    # capable 档要跑 LibreOffice, 2g 容易 OOM; full/harness 建议提到 4g
    mem_limit: ${DSH_MEM_LIMIT:-2g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "sh", "-c", "node -e \"fetch('http://'+require('os').networkInterfaces().eth0.find(i=>i.family==='IPv4').address+':3080/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  dsh-home:
  dsh-workspace: